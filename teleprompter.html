    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #050505;
      color: #ffffff;
    }

    /* Custom scrollbar styling for teleprompter display */
    .teleprompter-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .teleprompter-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .teleprompter-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Mirror Transformations */
    .mirror-horizontal {
      transform: scaleX(-1);
    }
    .mirror-vertical {
      transform: scaleY(-1);
    }
    .mirror-both {
      transform: scale(-1, -1);
    }

    .guide-line {
      pointer-events: none;
    }

    /* Hide scrollbar for clean single-line bar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .cursor-grab {
      cursor: grab;
      cursor: -webkit-grab;
    }
    .cursor-grabbing {
      cursor: grabbing;
      cursor: -webkit-grabbing;
    }
  </style>

    const ORIENTATION_MODES = {
      NORMAL: 'normal',
      MIRROR_H: 'mirror-h',
      MIRROR_V: 'mirror-v',
      MIRROR_BOTH: 'mirror-both'
    };

    const DEFAULT_COLORS = {

      ),

      ),
      Settings: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>

      ),
      Edit: ({ className = "w-5 h-5" }) => (

      ),
      Eye: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
      ),
      Fullscreen: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
      ),
      Download: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
      ),
      Upload: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
      ),
      Trash: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      ),
      Markdown: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="currentColor" viewBox="0 0 16 16"><path d="M14 3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h12zM2 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H2z"/><path fillRule="evenodd" d="M9.146 8.146a.5.5 0 0 1 .708 0L11.5 9.793l1.646-1.647a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 0 1 0-.708z"/><path fillRule="evenodd" d="M11.5 5a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-1 0v-5a.5.5 0 0 1 .5-.5zM3 5.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .374.168l1.626 1.83 1.626-1.83A.5.5 0 0 1 8.5 5h1a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-1 0V6.621L7.626 8.17a.5.5 0 0 1-.752 0L5.5 6.621V10.5a.5.5 0 0 1-1 0v-5z"/></svg>
      )
    };

    const TeleprompterDisplay = React.forwardRef(({
      text,
      orientation,
      width,
      fontSize,
      lineHeight,
      fontFamily,
      colors,
      guidePosition,
      showGuide,
      onWidthChange,
      onGuidePositionChange,
      onHandDragChange
    }, ref) => {

      const transformClass = React.useMemo(() => {
        switch (orientation) {
          case ORIENTATION_MODES.MIRROR_H: return 'mirror-horizontal';
          case ORIENTATION_MODES.MIRROR_V: return 'mirror-vertical';
          case ORIENTATION_MODES.MIRROR_BOTH: return 'mirror-both';
          default: return '';
        }
      }, [orientation]);

      const dynamicStyles = {
        '--text-color': colors.text,
        '--h1-color': colors.h1,
        '--h2-color': colors.h2,
        '--h3-color': colors.h3,
        '--bold-color': colors.bold,
        '--details-bg-color': colors.detailsBg,
        '--summary-text-color': colors.summaryText,
        fontSize: `${fontSize}px`,
        lineHeight: lineHeight,
        fontFamily: fontFamily,
        backgroundColor: colors.background
      };

      // Auto-parse Markdown and preserve HTML tags
      const renderedHtml = React.useMemo(() => {
        if (!text) return "";
        if (window.marked && typeof window.marked.parse === 'function') {
          try {
            return window.marked.parse(text);
          } catch (e) {
            return text;
          }
        }
        return text;
      }, [text]);

      // --- Red Arrows Guide Repositioning (Drag) & Width Resizing (Click) ---
      const [isDraggingGuide, setIsDraggingGuide] = React.useState(false);
      const guideDragRef = React.useRef({ startY: 0, startPos: guidePosition, moved: false, side: null });

      const handleArrowMouseDown = (side, e) => {
        e.stopPropagation();
        e.preventDefault();
        guideDragRef.current = {
          startY: e.clientY,
          startPos: guidePosition,
          moved: false,
          side
        };
        setIsDraggingGuide(true);
      };

      React.useEffect(() => {
        const handleMouseMoveGuide = (e) => {
          if (!guideDragRef.current.side) return;
          const deltaY = e.clientY - guideDragRef.current.startY;
          if (Math.abs(deltaY) > 2) {
            guideDragRef.current.moved = true;
          }
          if (onGuidePositionChange) {
            const percentage = (e.clientY / window.innerHeight) * 100;
            const clamped = Math.round(Math.min(90, Math.max(10, percentage)));
            onGuidePositionChange(clamped);
          }
        };

        const handleMouseUpGuide = () => {
          if (guideDragRef.current.side) {
            if (!guideDragRef.current.moved && onWidthChange) {
              // Click on arrow resizes width: left shrinks, right expands
              if (guideDragRef.current.side === 'left') {
                onWidthChange(prev => (prev <= 30 ? 100 : Math.max(30, prev - 10)));
              } else {
                onWidthChange(prev => (prev >= 100 ? 30 : Math.min(100, prev + 10)));
              }
            }
            guideDragRef.current = { startY: 0, startPos: 0, moved: false, side: null };
            setIsDraggingGuide(false);
          }
        };

        window.addEventListener('mousemove', handleMouseMoveGuide);
        window.addEventListener('mouseup', handleMouseUpGuide);
        return () => {
          window.removeEventListener('mousemove', handleMouseMoveGuide);
          window.removeEventListener('mouseup', handleMouseUpGuide);
        };
      }, [onGuidePositionChange, onWidthChange]);

      // --- Hand Tool Drag-to-Scroll ("Clic Main") ---
      const [isHandDragging, setIsHandDragging] = React.useState(false);
      const handDragRef = React.useRef({ startY: 0, startScrollTop: 0, isDown: false, hasMoved: false });

      const handleHandMouseDown = (e) => {
        if (e.button !== 0) return;
        // Do not initiate drag if clicking buttons, inputs, summaries, or guide controls
        if (e.target.closest('button, input, textarea, a, select, summary, .guide-line')) return;

        const container = ref.current;
        if (!container) return;

        handDragRef.current = {
          startY: e.clientY,
          startScrollTop: container.scrollTop,
          isDown: true,
          hasMoved: false
        };
        setIsHandDragging(true);
        if (onHandDragChange) onHandDragChange(true);
      };

      React.useEffect(() => {
        const handleHandMouseMove = (e) => {
          if (!handDragRef.current.isDown) return;
          const container = ref.current;
          if (!container) return;

          const deltaY = e.clientY - handDragRef.current.startY;
          if (Math.abs(deltaY) > 2) {
            handDragRef.current.hasMoved = true;
          }

          // Invert deltaY if vertical mirror is active
          const isMirroredV = orientation === ORIENTATION_MODES.MIRROR_V || orientation === ORIENTATION_MODES.MIRROR_BOTH;
          const direction = isMirroredV ? 1 : -1;

          container.scrollTop = handDragRef.current.startScrollTop + (deltaY * direction);
        };

        const handleHandMouseUp = () => {
          if (handDragRef.current.isDown) {
            handDragRef.current.isDown = false;
            setIsHandDragging(false);
            if (onHandDragChange) onHandDragChange(false);
          }
        };

        window.addEventListener('mousemove', handleHandMouseMove);
        window.addEventListener('mouseup', handleHandMouseUp);
        return () => {
          window.removeEventListener('mousemove', handleHandMouseMove);
          window.removeEventListener('mouseup', handleHandMouseUp);
        };
      }, [ref, orientation, onHandDragChange]);

      return (
        <div className="relative w-full h-full flex flex-col items-center justify-start overflow-hidden">
          {/* Target Eye-Line Overlay with Interactive Red Arrows to Reposition Guide */}
          {showGuide && (
            <div 
              className="guide-line absolute left-0 right-0 z-30 flex items-center justify-between px-3 pointer-events-none transition-all duration-75"
              style={{ top: `${guidePosition}%` }}
            >
              {/* Left Arrow: Glisser verticalement pour déplacer le repère / Clic pour réduire largeur */}
              <button
                type="button"
                onMouseDown={(e) => handleArrowMouseDown('left', e)}
                title="Glisser verticalement pour déplacer la hauteur du repère (Cliquer pour -10% largeur)"
                className={`pointer-events-auto w-8 h-8 rounded-r-xl bg-red-600/90 hover:bg-red-500 active:bg-red-700 backdrop-blur-sm flex items-center justify-center text-white shadow-lg text-xs font-bold cursor-ns-resize transition transform hover:scale-110 select-none ${
                  isDraggingGuide && guideDragRef.current.side === 'left' ? 'ring-2 ring-white scale-110 bg-red-500 shadow-red-500/50' : ''
                }`}
              >
                ►
              </button>

              {/* Laser-like Red Eyeline (No text or badge in the middle) */}
              <div className="flex-1 h-[2px] mx-2 bg-gradient-to-r from-red-600/80 via-red-500/40 to-red-600/80 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>

              {/* Right Arrow: Glisser verticalement pour déplacer le repère / Clic pour agrandir largeur */}
              <button
                type="button"
                onMouseDown={(e) => handleArrowMouseDown('right', e)}
                title="Glisser verticalement pour déplacer la hauteur du repère (Cliquer pour +10% largeur)"
                className={`pointer-events-auto w-8 h-8 rounded-l-xl bg-red-600/90 hover:bg-red-500 active:bg-red-700 backdrop-blur-sm flex items-center justify-center text-white shadow-lg text-xs font-bold cursor-ns-resize transition transform hover:scale-110 select-none ${
                  isDraggingGuide && guideDragRef.current.side === 'right' ? 'ring-2 ring-white scale-110 bg-red-500 shadow-red-500/50' : ''
                }`}
              >
                ◄
              </button>
            </div>
          )}

          {/* Scrolling Content Box with Hand Tool Drag-to-Scroll */}
          <div
            ref={ref}
            onMouseDown={handleHandMouseDown}
            className={`teleprompter-scroll w-full h-full overflow-y-auto transition-transform duration-300 ease-out flex justify-center select-none ${transformClass} ${
              isHandDragging ? 'cursor-grabbing' : 'cursor-grab'
            }`}
          >
            <style>{`
              .teleprompter-content {
                color: var(--text-color);
              }
              .teleprompter-content h1 { 
                color: var(--h1-color); 
                font-size: 1.6em; 
                line-height: 1.2;
                font-weight: 800;
                margin: 0.8em 0 0.4em; 
              }
              .teleprompter-content h2 { 
                color: var(--h2-color); 
                font-size: 1.35em; 
                line-height: 1.25;
                font-weight: 700;
                margin: 0.9em 0 0.45em; 
              }
              .teleprompter-content h3 { 
                color: var(--h3-color); 
                font-size: 1.15em; 
                line-height: 1.3;
                font-weight: 600;
                margin: 1em 0 0.5em; 
              }
              .teleprompter-content strong, .teleprompter-content b { 
                color: var(--bold-color); 
                font-weight: 700; 
              }
              .teleprompter-content p {
                margin: 0.6em 0;
              }
              .teleprompter-content ul, .teleprompter-content ol {
                margin-left: 2em;
                margin-top: 0.5em;
                margin-bottom: 0.5em;
              }
              .teleprompter-content ul li { list-style-type: disc; }
              .teleprompter-content ol li { list-style-type: decimal; }
              .teleprompter-content blockquote {
                border-left: 4px solid var(--h1-color);
                padding-left: 1em;
                font-style: italic;
                margin: 1em 0;
                opacity: 0.85;
              }
              .teleprompter-content pre, .teleprompter-content code {
                font-family: monospace;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                padding: 0.2em 0.4em;
              }
              .teleprompter-content details {
                background-color: var(--details-bg-color);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 12px;
                padding: 0.75em 1.25em;
                margin: 1.2em 0;
              }
              .teleprompter-content summary {
                color: var(--summary-text-color);
                font-weight: 600;
                cursor: pointer;
                outline: none;
              }
            `}</style>
            
            <div
              className="teleprompter-content py-[45vh] px-6 text-left transition-all duration-200"
              style={{
                width: `${width}%`,
                maxWidth: '100%',
                ...dynamicStyles
              }}
              dangerouslySetInnerHTML={{ __html: renderedHtml }}
            />
          </div>
        </div>
      );
    });

    const ScriptManagerModal = ({
      isOpen,
      onClose,
      scripts,
      activeScriptId,
      onSelectScript,
      onSaveScript,
      onDeleteScript,
      onImportJson,
      onExportJson,
      countdownDuration,
      onCountdownDurationChange,
      fontFamily,
      onFontFamilyChange,
      lineHeight,
      onLineHeightChange,
      colors,
      onColorsChange,
      onResetColors,
      guidePosition,
      onGuidePositionChange,
      showGuide,
      onToggleGuide,
      orientation,
      onOrientationCycle
    }) => {
      const [activeTab, setActiveTab] = React.useState('scripts');
      const [editingScript, setEditingScript] = React.useState(null);
      const textareaRef = React.useRef(null);

      React.useEffect(() => {
        setActiveTab('scripts');
      }, [isOpen]);

      React.useEffect(() => {
        const current = scripts.find(s => s.id === activeScriptId) || scripts[0];
        if (current) {
          setEditingScript({ ...current });
        }
      }, [activeScriptId, scripts, isOpen]);

      if (!isOpen || !editingScript) return null;

      const handleSave = () => {
        onSaveScript(editingScript);
        onClose();
      };

      const handleCreateNew = () => {
        const newDoc = {
          id: `script-${Date.now()}`,
          title: "Nouveau Discours",
          category: "Général",
          updatedAt: new Date().toISOString().split('T')[0],
          text: "# Titre de votre discours\n\nSaisissez ou collez votre texte ici en **Markdown** ou HTML..."
        };
        setEditingScript(newDoc);
      };

      const handleDelete = (scriptId, e) => {
        e.stopPropagation();
        if (scripts.length <= 1) {
          alert("Vous devez conserver au moins un script.");
          return;
        }
        if (confirm("Voulez-vous vraiment supprimer ce script ?")) {
          onDeleteScript(scriptId);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const isMarkdownOrText = file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.name.endsWith('.txt');
        const reader = new FileReader();

        reader.onload = (event) => {
          const content = event.target.result;
          if (isMarkdownOrText) {
            let title = file.name.replace(/\.(md|markdown|txt)$/i, '');
            const matchTitle = content.match(/^#\s+(.+)$/m);
            if (matchTitle && matchTitle[1]) {
              title = matchTitle[1].trim();
            }
            const newDoc = {
              id: `script-${Date.now()}`,
              title: title || "Script Markdown importé",
              category: "Markdown",
              updatedAt: new Date().toISOString().split('T')[0],
              text: content
            };
            onSaveScript(newDoc);
            setEditingScript(newDoc);
          } else {
            try {
              const parsed = JSON.parse(content);
              onImportJson(parsed);
            } catch (err) {
              alert("Erreur lors de la lecture du fichier JSON ou Markdown.");
            }
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const insertMarkdown = (prefix, suffix = "") => {
        if (!textareaRef.current) return;
        const textarea = textareaRef.current;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const currentText = editingScript.text || "";
        const selectedText = currentText.substring(start, end);
        const replacement = `${prefix}${selectedText || "texte"}${suffix}`;
        
        const newText = currentText.substring(0, start) + replacement + currentText.substring(end);
        setEditingScript({ ...editingScript, text: newText });

        setTimeout(() => {
          textarea.focus();
          textarea.setSelectionRange(start + prefix.length, start + replacement.length - suffix.length);
        }, 50);
      };

      return (
        <div className="fixed inset-0 z-[200] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-gray-900 border border-gray-800 w-full max-w-5xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            
            {/* Modal Top Header with Navigation Tabs (Scripts is always first) & Close button */}
            <div className="px-5 py-3 border-b border-gray-800 bg-gray-950/90 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setActiveTab('scripts')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                    activeTab === 'scripts'
                      ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'
                      : 'text-gray-400 hover:text-white hover:bg-gray-800'
                  }`}
                >
                  <Icons.Document className="w-4 h-4" />
                  <span>Scripts</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveTab('options')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                    activeTab === 'options'
                      ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'
                      : 'text-gray-400 hover:text-white hover:bg-gray-800'
                  }`}
                >
                  <Icons.Settings className="w-4 h-4" />
                  <span>Options</span>
                </button>
              </div>

              <button
                type="button"
                onClick={onClose}
                className="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition"
                title="Fermer (Échap)"
              >
                <Icons.Close className="w-5 h-5" />
              </button>
            </div>

            {/* TAB 1 : SCRIPTS */}
            {activeTab === 'scripts' && (
              <div className="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">
                {/* Sidebar: Script Selection */}
                <div className="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-gray-800 bg-gray-950/50 p-4 flex flex-col">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icons.Document className="text-blue-500 w-4 h-4" /> Mes Scripts
                    </h3>
                    <button
                      onClick={handleCreateNew}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition shadow-sm shadow-blue-600/20"
                    >
                      + Nouveau
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                    {scripts.map((script) => (
                      <div
                        key={script.id}
                        onClick={() => {
                          onSelectScript(script.id);
                          setEditingScript({ ...script });
                        }}
                        className={`p-3 rounded-xl cursor-pointer border transition group flex items-start justify-between gap-2 ${
                          script.id === editingScript.id
                            ? 'bg-blue-600/20 border-blue-500 text-white'
                            : 'bg-gray-900 border-gray-800 text-gray-300 hover:bg-gray-800'
                        }`}
                      >
                        <div className="flex-1 min-w-0">
                          <div className="font-semibold text-sm truncate">{script.title}</div>
                          <div className="flex items-center justify-between text-xs text-gray-400 mt-2">
                            <span className="bg-gray-800 px-2 py-0.5 rounded text-gray-300">{script.category}</span>
                            <span>{script.updatedAt}</span>
                          </div>
                        </div>
                        {scripts.length > 1 && (
                          <button
                            onClick={(e) => handleDelete(script.id, e)}
                            className="opacity-0 group-hover:opacity-100 p-1.5 text-gray-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition"
                            title="Supprimer ce script"
                          >
                            <Icons.Trash className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="pt-4 border-t border-gray-800 flex flex-col gap-2">
                    <label className="flex items-center justify-center gap-2 px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg cursor-pointer transition">
                      <Icons.Markdown className="w-4 h-4 text-purple-400" />
                      <span>Importer Markdown (.md, .txt)</span>
                      <input type="file" accept=".md,.markdown,.txt" onChange={handleFileUpload} className="hidden" />
                    </label>

                    <label className="flex items-center justify-center gap-2 px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg cursor-pointer transition">
                      <Icons.Upload className="w-4 h-4 text-emerald-400" />
                      <span>Importer JSON (.json)</span>
                      <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                    </label>

                    <button
                      onClick={onExportJson}
                      className="flex items-center justify-center gap-2 px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg transition"
                    >
                      <Icons.Download className="w-4 h-4 text-sky-400" />
                      <span>Exporter tous les Scripts (JSON)</span>
                    </button>
                  </div>
                </div>

                {/* Content Editor Panel */}
                <div className="flex-1 p-6 flex flex-col bg-gray-900 overflow-hidden">
                  <div className="mb-4">
                    <input
                      type="text"
                      value={editingScript.title}
                      onChange={(e) => setEditingScript({ ...editingScript, title: e.target.value })}
                      className="text-xl font-bold bg-transparent border-b border-gray-700 focus:border-blue-500 outline-none text-white pb-1 w-full"
                      placeholder="Titre du document..."
                    />
                  </div>

                  <div className="mb-3 flex items-center justify-between gap-4 flex-wrap">
                    <div className="flex items-center gap-2 text-xs">
                      <span className="text-gray-400">Catégorie :</span>
                      <input
                        type="text"
                        value={editingScript.category || ''}
                        onChange={(e) => setEditingScript({ ...editingScript, category: e.target.value })}
                        className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    {/* Markdown Toolbar */}
                    <div className="flex items-center gap-1.5 bg-gray-950/60 p-1 rounded-lg border border-gray-800">
                      <button
                        type="button"
                        onClick={() => insertMarkdown('# ')}
                        className="px-2 py-0.5 text-xs bg-gray-800 hover:bg-gray-700 rounded text-gray-300 font-bold"
                        title="Titre H1 (#)"
                      >
                        H1
                      </button>
                      <button
                        type="button"
                        onClick={() => insertMarkdown('## ')}
                        className="px-2 py-0.5 text-xs bg-gray-800 hover:bg-gray-700 rounded text-gray-300 font-bold"
                        title="Sous-titre H2 (##)"
                      >
                        H2
                      </button>
                      <button
                        type="button"
                        onClick={() => insertMarkdown('**', '**')}
                        className="px-2 py-0.5 text-xs bg-gray-800 hover:bg-gray-700 rounded text-gray-300 font-bold"
                        title="Texte en gras (**texte**)"
                      >
                        B
                      </button>
                      <button
                        type="button"
                        onClick={() => insertMarkdown('- ')}
                        className="px-2 py-0.5 text-xs bg-gray-800 hover:bg-gray-700 rounded text-gray-300"
                        title="Liste à puces (-)"
                      >
                        • Liste
                      </button>
                      <button
                        type="button"
                        onClick={() => insertMarkdown('<details>\n  <summary>💡 Note pour le présentateur</summary>\n  <p>', '</p>\n</details>')}
                        className="px-2 py-0.5 text-xs bg-gray-800 hover:bg-gray-700 rounded text-amber-400"
                        title="Note / Souffleur (<details>)"
                      >
                        💡 Note
                      </button>
                    </div>
                  </div>

                  <div className="flex-1 flex flex-col mb-4 min-h-0">
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs text-gray-400 font-medium">
                        Contenu Markdown ou HTML (collez directement votre texte) :
                      </label>
                      <span className="text-[11px] text-gray-500 hidden sm:inline">Supporte le Markdown (#, **, -, etc.) et le HTML</span>
                    </div>
                    <textarea
                      ref={textareaRef}
                      value={editingScript.text}
                      onChange={(e) => setEditingScript({ ...editingScript, text: e.target.value })}
                      className="w-full flex-1 bg-gray-950 border border-gray-800 rounded-xl p-4 font-mono text-xs text-gray-200 outline-none focus:border-blue-500 resize-none leading-relaxed"
                      placeholder="# Titre du discours&#10;&#10;Rédigez ou collez votre texte ici en Markdown ou HTML..."
                    />
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-2">
                    <button
                      onClick={onClose}
                      className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm font-medium transition"
                    >
                      Annuler
                    </button>
                    <button
                      onClick={handleSave}
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/30"
                    >
                      Enregistrer le Script
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2 : OPTIONS */}
            {activeTab === 'options' && (
              <div className="flex-1 p-6 overflow-y-auto bg-gray-900 min-h-0 space-y-6">
                {/* Minuteur / Compte à rebours avant départ */}
                <div className="bg-gray-950/60 border border-gray-800 rounded-2xl p-5 shadow-lg">
                  <div className="flex items-center justify-between mb-2">
                    <h4 className="text-base font-bold text-white flex items-center gap-2">
                      <span>⏱️</span> Compte à Rebours (Timer)
                    </h4>
                    <span className="text-xs font-mono font-bold text-blue-400 bg-blue-950/50 border border-blue-800/60 px-2.5 py-1 rounded-lg">
                      {countdownDuration === 0 ? "Désactivé (0s)" : `${countdownDuration} secondes`}
                    </span>
                  </div>
                  <p className="text-xs text-gray-400 mb-4">
                    Délai d'attente avant que le texte commence à défiler lorsque vous appuyez sur Lancer.
                  </p>

                  <div className="flex flex-wrap items-center gap-2 mb-3">
                    {[
                      { label: 'Désactivé (0s)', val: 0 },
                      { label: '2s', val: 2 },
                      { label: '3s (défaut)', val: 3 },
                      { label: '5s', val: 5 },
                      { label: '10s', val: 10 }
                    ].map(preset => (
                      <button
                        key={preset.val}
                        type="button"
                        onClick={() => onCountdownDurationChange(preset.val)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${
                          countdownDuration === preset.val
                            ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                            : 'bg-gray-800 hover:bg-gray-700 text-gray-300'
                        }`}
                      >
                        {preset.label}
                      </button>
                    ))}

                    <div className="flex items-center gap-2 ml-auto">
                      <span className="text-xs text-gray-400">Personnalisé :</span>
                      <input
                        type="number"
                        min="0"
                        max="30"
                        value={countdownDuration}
                        onChange={(e) => onCountdownDurationChange(Math.max(0, Math.min(30, parseInt(e.target.value) || 0)))}
                        className="w-16 bg-gray-900 border border-gray-700 focus:border-blue-500 rounded-lg px-2 py-1 text-center font-mono text-xs text-white"
                      />
                      <span className="text-xs text-gray-400">sec</span>
                    </div>
                  </div>

                  <div className="p-3 bg-blue-950/40 border border-blue-900/50 rounded-xl flex items-center gap-2 text-xs text-blue-200">
                    <span className="text-base">💡</span>
                    <span>
                      <strong>Astuce :</strong> Pendant le décompte, appuyez une deuxième fois sur <kbd className="bg-gray-800 px-1 py-0.5 rounded border border-gray-700 font-mono text-[10px] text-white">Espace</kbd> (ou sur le bouton Lancer) pour démarrer le défilement immédiatement !
                    </span>
                  </div>
                </div>

                {/* Typographie & Interligne */}
                <div className="bg-gray-950/60 border border-gray-800 rounded-2xl p-5 shadow-lg">
                  <h4 className="text-base font-bold text-white flex items-center gap-2 mb-2">
                    <span>🔤</span> Typographie & Interligne
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
                    <div>
                      <label className="text-xs font-medium text-gray-400 block mb-1.5">Police de caractères :</label>
                      <div className="grid grid-cols-2 gap-2">
                        {[
                          { label: 'Inter (Défaut)', val: 'Inter' },
                          { label: 'Lexend (Lisibilité)', val: 'Lexend' },
                          { label: 'Sans-Serif', val: 'system-ui, sans-serif' },
                          { label: 'Monospace', val: 'monospace' }
                        ].map(f => (
                          <button
                            key={f.val}
                            type="button"
                            onClick={() => onFontFamilyChange(f.val)}
                            className={`p-2 rounded-xl text-xs font-medium border text-left transition ${
                              fontFamily === f.val
                                ? 'border-blue-500 bg-blue-600/20 text-white'
                                : 'border-gray-800 bg-gray-900 text-gray-300 hover:bg-gray-800'
                            }`}
                            style={{ fontFamily: f.val }}
                          >
                            {f.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-medium text-gray-400 block mb-1.5">Interligne (Hauteur de ligne) :</label>
                      <div className="grid grid-cols-4 gap-2">
                        {[1.2, 1.4, 1.6, 1.8].map(lh => (
                          <button
                            key={lh}
                            type="button"
                            onClick={() => onLineHeightChange(lh)}
                            className={`p-2 rounded-xl text-xs font-mono font-bold text-center border transition ${
                              lineHeight === lh
                                ? 'border-blue-500 bg-blue-600/20 text-white'
                                : 'border-gray-800 bg-gray-900 text-gray-300 hover:bg-gray-800'
                            }`}
                          >
                            {lh}x
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Couleurs du Texte & Fond */}
                <div className="bg-gray-950/60 border border-gray-800 rounded-2xl p-5 shadow-lg">
                  <div className="flex items-center justify-between mb-3">
                    <h4 className="text-base font-bold text-white flex items-center gap-2">
                      <span>🎨</span> Couleurs du Texte & Fond
                    </h4>
                    <button
                      type="button"
                      onClick={onResetColors}
                      className="text-xs text-gray-400 hover:text-white underline transition"
                    >
                      Rétablir les couleurs par défaut
                    </button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                    {[
                      { key: 'background', label: 'Arrière-plan' },
                      { key: 'text', label: 'Texte normal' },
                      { key: 'h1', label: 'Titre H1' },
                      { key: 'h2', label: 'Sous-titre H2' },
                      { key: 'h3', label: 'Titre H3' },
                      { key: 'bold', label: 'Texte en gras' },
                      { key: 'detailsBg', label: 'Fond note' },
                      { key: 'summaryText', label: 'Titre note' }
                    ].map(item => (
                      <div key={item.key} className="p-2.5 bg-gray-900 border border-gray-800 rounded-xl flex items-center justify-between gap-2">
                        <span className="text-xs text-gray-300 truncate">{item.label}</span>
                        <input
                          type="color"
                          value={colors[item.key] || '#ffffff'}
                          onChange={(e) => onColorsChange({ ...colors, [item.key]: e.target.value })}
                          className="w-7 h-7 rounded-lg cursor-pointer bg-transparent border-0 outline-none"
                        />
                      </div>
                    ))}
                  </div>
                </div>

                {/* Repère d'œil & Affichage */}
                <div className="bg-gray-950/60 border border-gray-800 rounded-2xl p-5 shadow-lg">
                  <h4 className="text-base font-bold text-white flex items-center gap-2 mb-3">
                    <span>📐</span> Repère d'Œil & Miroir
                  </h4>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="text-xs font-medium text-gray-400">Position de la ligne repère :</label>
                        <span className="text-xs font-mono font-bold text-red-400">{guidePosition}%</span>
                      </div>
                      <input
                        type="range"
                        min="10"
                        max="90"
                        value={guidePosition}
                        onChange={(e) => onGuidePositionChange(Number(e.target.value))}
                        className="w-full accent-red-600 cursor-pointer"
                      />
                    </div>

                    <div className="flex items-center justify-between p-3 bg-gray-900 border border-gray-800 rounded-xl">
                      <div>
                        <div className="text-xs font-semibold text-white">Ligne repère rouge</div>
                        <div className="text-[11px] text-gray-400">Afficher la ligne d'alignement du regard</div>
                      </div>
                      <button
                        type="button"
                        onClick={onToggleGuide}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                          showGuide ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400'
                        }`}
                      >
                        {showGuide ? 'Visible' : 'Masquée'}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-end pt-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/30"
                  >
                    Terminer et Reprendre
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const FloatingControls = ({
      isPlaying,
      speed,
      fontSize,
      width,
      orientation,
      showGuide,
      controlsVisible,
      isCountingDown,
      countdownValue,
      onPlayPause,
      onReset,
      onSpeedChange,
      onFontSizeChange,
      onWidthChange,
      onOrientationCycle,
      onToggleGuide,
      onToggleControls,
      onOpenScriptManager,
      onToggleFullscreen
    }) => {
      return (
        <React.Fragment>
          {/* Main Action Bar & Discrete Keyboard Shortcuts Wrapper */}
          <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 max-w-[98vw] flex flex-col items-center pointer-events-none ${
            controlsVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'
          }`}>

            {/* Discrete Keyboard Shortcuts */}
            <div className="pointer-events-auto mb-1.5 flex items-center justify-center gap-1.5 sm:gap-2 text-[10px] text-gray-400/80 font-mono select-none px-3.5 py-1 rounded-full bg-gray-950/75 backdrop-blur-md border border-gray-800/60 shadow-lg max-w-[95vw] overflow-x-auto no-scrollbar whitespace-nowrap">
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1.5 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">Espace</kbd> Pause</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">↑↓</kbd> Vitesse</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">←→</kbd> Taille</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">[ ]</kbd> Largeur</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">R</kbd> Reset</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">M</kbd> Miroir</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">G</kbd> Repère</span>
              <span className="text-gray-600">·</span>
              <span className="flex items-center gap-1"><kbd className="bg-gray-800/90 border border-gray-700/60 px-1 py-0.5 rounded text-[9px] text-gray-200 font-sans font-semibold shadow-sm">F</kbd> Plein écran</span>
            </div>

            {/* Strict Single Line Controls Bar */}
            <div className="pointer-events-auto bg-gray-900/95 backdrop-blur-xl border border-gray-800/90 text-white px-3 py-2 rounded-2xl shadow-2xl flex items-center gap-1.5 sm:gap-2 flex-nowrap whitespace-nowrap overflow-x-auto no-scrollbar">
              
              {/* Play / Pause Toggle Button */}
              <button
                onClick={onPlayPause}
                className={`px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 transition transform active:scale-95 shadow-lg flex-shrink-0 text-sm ${
                  isPlaying 
                    ? 'bg-amber-500 hover:bg-amber-400 text-black shadow-amber-500/20' 
                    : 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-600/30'
                }`}
              >
                {isCountingDown ? (
                  <span className="text-lg font-black animate-ping px-1">{countdownValue}</span>
                ) : isPlaying ? (
                  <> <Icons.Pause className="w-4 h-4" /> Pause </>
                ) : (
                  <> <Icons.Play className="w-4 h-4" /> Lancer </>
                )}
              </button>

              {/* Reset Button */}
              <button
                onClick={onReset}
                title="Réinitialiser (R)"
                className="p-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white rounded-xl transition flex-shrink-0"
              >
                <Icons.Reset className="w-4 h-4" />
              </button>

              <div className="h-7 w-[1px] bg-gray-800 flex-shrink-0"></div>

              {/* Speed Controller */}
              <div className="flex items-center gap-1 bg-gray-950/70 px-1.5 py-1 rounded-xl border border-gray-800/80 flex-shrink-0">
                <button 
                  onClick={() => onSpeedChange(Math.max(0.2, speed - 0.2))}
                  title="Ralentir (Flèche Bas)"
                  className="w-6 h-6 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-xs font-bold"
                >
                  -
                </button>
                <div className="flex flex-col items-center px-1 min-w-[42px]">
                  <span className="text-[8px] text-gray-400 uppercase tracking-wider font-semibold">Vitesse</span>
                  <span className="text-xs font-mono font-bold text-blue-400">{speed.toFixed(1)}x</span>
                </div>
                <button 
                  onClick={() => onSpeedChange(Math.min(5.0, speed + 0.2))}
                  title="Accélérer (Flèche Haut)"
                  className="w-6 h-6 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-xs font-bold"
                >
                  +
                </button>
              </div>

              {/* Font Size Controller */}
              <div className="flex items-center gap-1 bg-gray-950/70 px-1.5 py-1 rounded-xl border border-gray-800/80 flex-shrink-0">
                <button 
                  onClick={() => onFontSizeChange(Math.max(20, fontSize - 4))}
                  title="Police plus petite (Flèche Gauche)"
                  className="w-6 h-6 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-[11px] font-bold"
                >
                  A-
                </button>
                <div className="flex flex-col items-center px-1 min-w-[38px]">
                  <span className="text-[8px] text-gray-400 uppercase tracking-wider font-semibold">Police</span>
                  <span className="text-xs font-mono font-bold text-emerald-400">{fontSize}px</span>
                </div>
                <button 
                  onClick={() => onFontSizeChange(Math.min(120, fontSize + 4))}
                  title="Police plus grande (Flèche Droite)"
                  className="w-6 h-6 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-[11px] font-bold"
                >
                  A+
                </button>
              </div>

              {/* Width Controller */}
              <div className="flex items-center gap-1 bg-gray-950/70 px-1.5 py-1 rounded-xl border border-gray-800/80 flex-shrink-0">
                <button 
                  onClick={() => onWidthChange(Math.max(30, width - 10))}
                  title="Rétrécir la colonne (Touche [ )"
                  className="w-6 h-6 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-xs font-bold"
                >
                  ⇤
                </button>
                <div className="flex flex-col items-center px-1 min-w-[40px]">
                  <span className="text-[8px] text-gray-400 uppercase tracking-wider font-semibold">Largeur</span>
                  <span className="text-xs font-mono font-bold text-amber-400">{width}%</span>
                </div>
                <button 
                  onClick={() => onWidthChange(Math.min(100, width + 10))}
                  title="Élargir la colonne (Touche ] )"
                  className="w-6 h-6 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center text-xs font-bold"
                >
                  ⇥
                </button>
              </div>

              <div className="h-7 w-[1px] bg-gray-800 flex-shrink-0"></div>

              {/* Orientation Mode Button */}
              <button
                onClick={onOrientationCycle}
                className={`p-2.5 rounded-xl transition flex items-center gap-1.5 text-xs font-medium flex-shrink-0 ${
                  orientation !== ORIENTATION_MODES.NORMAL 
                    ? 'bg-purple-600/20 text-purple-300 border border-purple-500/50' 
                    : 'bg-gray-800 hover:bg-gray-700 text-gray-300'
                }`}
                title="Mode miroir (M)"
              >
                <Icons.Flip className="w-4 h-4" />
                <span className="hidden xl:inline capitalize">
                  {orientation === ORIENTATION_MODES.NORMAL ? 'Miroir' : orientation}
                </span>
              </button>

              {/* Guide Toggle */}
              <button
                onClick={onToggleGuide}
                className={`p-2.5 rounded-xl transition flex-shrink-0 ${
                  showGuide 
                    ? 'bg-red-600/20 text-red-400 border border-red-500/50' 
                    : 'bg-gray-800 hover:bg-gray-700 text-gray-300'
                }`}
                title="Ligne repère d'œil (G)"
              >
                <Icons.Eye className="w-4 h-4" />
              </button>

              {/* Open Menu Modal (Scripts & Options) */}
              <button
                onClick={onOpenScriptManager}
                className="p-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white rounded-xl transition flex items-center gap-1.5 text-xs font-medium flex-shrink-0"
                title="Menu : Scripts & Options (Édition)"
              >
                <Icons.Edit className="w-4 h-4" />
                <span className="hidden sm:inline">Menu</span>
              </button>

              {/* Fullscreen Button */}
              <button
                onClick={onToggleFullscreen}
                className="p-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white rounded-xl transition flex-shrink-0"
                title="Plein écran (F)"
              >
                <Icons.Fullscreen className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* Toggle Control Bar Button */}
          <button
            onClick={onToggleControls}
            className="fixed bottom-6 right-6 z-[101] w-12 h-12 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-2xl flex items-center justify-center transition-transform transform active:scale-90"
            title={controlsVisible ? "Masquer la barre" : "Afficher la barre"}
          >
            {controlsVisible ? <Icons.Close /> : <Icons.Settings />}
          </button>
        </React.Fragment>
      );
    };

    function App() {
      const [scripts, setScripts] = React.useState(() => {
        const saved = localStorage.getItem('prompter_scripts');
        if (saved) {
          try { 
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch (e) {}
        }
        return DEFAULT_SCRIPTS_JSON;
      });

      const [activeScriptId, setActiveScriptId] = React.useState(() => {
        return scripts[0]?.id || "celestory-training";
      });

      const [isPlaying, setIsPlaying] = React.useState(false);
      const [speed, setSpeed] = React.useState(1.2);
      const [width, setWidth] = React.useState(() => {
        const saved = localStorage.getItem('prompter_width');
        return saved ? Number(saved) : 75;
      });
      const [fontSize, setFontSize] = React.useState(() => {
        const saved = localStorage.getItem('prompter_font_size');
        return saved ? Number(saved) : 56;
      });
      const [countdownDuration, setCountdownDuration] = React.useState(() => {
        const saved = localStorage.getItem('prompter_countdown_duration');
        return saved !== null ? Number(saved) : 3;
      });
      const [lineHeight, setLineHeight] = React.useState(() => {
        const saved = localStorage.getItem('prompter_line_height');
        return saved ? Number(saved) : 1.5;
      });
      const [fontFamily, setFontFamily] = React.useState(() => {
        return localStorage.getItem('prompter_font_family') || 'Inter';
      });
      const [orientation, setOrientation] = React.useState(ORIENTATION_MODES.NORMAL);
      const [colors, setColors] = React.useState(() => {
        const saved = localStorage.getItem('prompter_colors');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return DEFAULT_COLORS;
      });
      const [showGuide, setShowGuide] = React.useState(true);
      const [guidePosition, setGuidePosition] = React.useState(() => {
        const saved = localStorage.getItem('prompter_guide_pos');
        return saved ? Number(saved) : 35;
      });
      const [controlsVisible, setControlsVisible] = React.useState(true);
      const [isScriptManagerOpen, setIsScriptManagerOpen] = React.useState(false);

      const [isCountingDown, setIsCountingDown] = React.useState(false);
      const [countdownValue, setCountdownValue] = React.useState(3);
      const [isHandDragging, setIsHandDragging] = React.useState(false);

      const scrollContainerRef = React.useRef(null);
      const animationFrameRef = React.useRef(null);
      const lastTimeRef = React.useRef(null);
      const startTimeRef = React.useRef(null);
      const totalTimeRef = React.useRef(0);

      const activeScript = React.useMemo(() => {
        return scripts.find(s => s.id === activeScriptId) || scripts[0] || { text: "" };
      }, [scripts, activeScriptId]);

      React.useEffect(() => {
        localStorage.setItem('prompter_scripts', JSON.stringify(scripts));
      }, [scripts]);

      React.useEffect(() => {
        localStorage.setItem('prompter_font_size', String(fontSize));
      }, [fontSize]);

      React.useEffect(() => {
        localStorage.setItem('prompter_width', String(width));
      }, [width]);

      React.useEffect(() => {
        localStorage.setItem('prompter_guide_pos', String(guidePosition));
      }, [guidePosition]);

      React.useEffect(() => {
        localStorage.setItem('prompter_countdown_duration', String(countdownDuration));
      }, [countdownDuration]);

      React.useEffect(() => {
        localStorage.setItem('prompter_font_family', fontFamily);
      }, [fontFamily]);

      React.useEffect(() => {
        localStorage.setItem('prompter_line_height', String(lineHeight));
      }, [lineHeight]);

      React.useEffect(() => {
        localStorage.setItem('prompter_colors', JSON.stringify(colors));
      }, [colors]);

      const handleResetColors = () => {
        setColors(DEFAULT_COLORS);
      };

      // Scroll Animation Engine
      React.useEffect(() => {
        const scrollStep = (currentTime) => {
          if (!lastTimeRef.current) lastTimeRef.current = currentTime;
          const deltaTime = (currentTime - lastTimeRef.current) / 1000;
          lastTimeRef.current = currentTime;

          if (scrollContainerRef.current && isPlaying && !isCountingDown && !isHandDragging) {
            const container = scrollContainerRef.current;
            const pxPerSecond = speed * 60;
            container.scrollTop += pxPerSecond * deltaTime;

            if (container.scrollTop >= container.scrollHeight - container.clientHeight - 5) {
              setIsPlaying(false);
              dispatchCelestoryOutput(100);
            }
          }

          if (isPlaying && !isCountingDown) {
            animationFrameRef.current = requestAnimationFrame(scrollStep);
          }
        };

        if (isPlaying && !isCountingDown) {
          lastTimeRef.current = performance.now();
          animationFrameRef.current = requestAnimationFrame(scrollStep);
        } else {
          if (animationFrameRef.current) {
            cancelAnimationFrame(animationFrameRef.current);
          }
        }

        return () => {
          if (animationFrameRef.current) {
            cancelAnimationFrame(animationFrameRef.current);
          }
        };
      }, [isPlaying, isCountingDown, speed, isHandDragging]);

      const dispatchCelestoryOutput = (explicitCompletion = null) => {
        try {
          if (scrollContainerRef.current) {
            const c = scrollContainerRef.current;
            const completion = explicitCompletion !== null
              ? explicitCompletion
              : Math.min(100, Math.round((c.scrollTop / (c.scrollHeight - c.clientHeight || 1)) * 100));
            
            if (startTimeRef.current) {
              totalTimeRef.current += (Date.now() - startTimeRef.current) / 1000;
              startTimeRef.current = null;
            }

            const evt = new CustomEvent("CelestoryOutput", {
              detail: { contentCompletion: completion, timeSpent: Math.round(totalTimeRef.current) }
            });
            window.parent?.document?.dispatchEvent(evt);
          }
        } catch (e) {}
      };

      const handlePlayPause = React.useCallback(() => {
        if (isCountingDown) {
          // Second click on space launches prompter immediately!
          setIsCountingDown(false);
          setIsPlaying(true);
          startTimeRef.current = Date.now();
          return;
        }
        if (isPlaying) {
          setIsPlaying(false);
          dispatchCelestoryOutput();
        } else {
          if (countdownDuration > 0) {
            setIsCountingDown(true);
            setCountdownValue(countdownDuration);
          } else {
            setIsPlaying(true);
            startTimeRef.current = Date.now();
          }
        }
      }, [isPlaying, isCountingDown, countdownDuration]);

      React.useEffect(() => {
        let timer;
        if (isCountingDown) {
          if (countdownValue > 1) {
            timer = setTimeout(() => {
              setCountdownValue(prev => prev - 1);
            }, 1000);
          } else if (countdownValue === 1) {
            timer = setTimeout(() => {
              setIsCountingDown(false);
              setIsPlaying(true);
              startTimeRef.current = Date.now();
            }, 1000);
          }
        }
        return () => clearTimeout(timer);
      }, [isCountingDown, countdownValue]);

      const handleReset = React.useCallback(() => {
        setIsPlaying(false);
        setIsCountingDown(false);
        if (scrollContainerRef.current) {
          scrollContainerRef.current.scrollTop = 0;
        }
        totalTimeRef.current = 0;
        startTimeRef.current = null;
        dispatchCelestoryOutput(0);
      }, []);

      const handleOrientationCycle = () => {
        const modes = [
          ORIENTATION_MODES.NORMAL,
          ORIENTATION_MODES.MIRROR_H,
          ORIENTATION_MODES.MIRROR_V,
          ORIENTATION_MODES.MIRROR_BOTH
        ];
        const currentIndex = modes.indexOf(orientation);
        const nextMode = modes[(currentIndex + 1) % modes.length];
        setOrientation(nextMode);
      };

      const handleSaveScript = (updatedScript) => {
        setScripts(prev => {
          const index = prev.findIndex(s => s.id === updatedScript.id);
          if (index >= 0) {
            const newArr = [...prev];
            newArr[index] = updatedScript;
            return newArr;
          }
          return [updatedScript, ...prev];
        });
        setActiveScriptId(updatedScript.id);
      };

      const handleDeleteScript = (scriptId) => {
        setScripts(prev => {
          const next = prev.filter(s => s.id !== scriptId);
          if (activeScriptId === scriptId && next.length > 0) {
            setActiveScriptId(next[0].id);
          }
          return next;
        });
      };

      const handleImportJson = (jsonArr) => {
        if (Array.isArray(jsonArr) && jsonArr.length > 0) {
          setScripts(jsonArr);
          setActiveScriptId(jsonArr[0].id);
        } else if (typeof jsonArr === 'object' && jsonArr.text) {
          handleSaveScript(jsonArr);
        }
      };

      const handleExportJson = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scripts, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `teleprompter_scripts_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        }
      };

      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          if (e.code === 'Space') {
            e.preventDefault();
            handlePlayPause();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSpeed(prev => Math.min(5.0, Number((prev + 0.2).toFixed(1))));
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSpeed(prev => Math.max(0.2, Number((prev - 0.2).toFixed(1))));
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            setFontSize(prev => Math.min(120, prev + 4));
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setFontSize(prev => Math.max(20, prev - 4));
          } else if (e.key === ']') {
            e.preventDefault();
            setWidth(prev => Math.min(100, prev + 5));
          } else if (e.key === '[') {
            e.preventDefault();
            setWidth(prev => Math.max(30, prev - 5));
          } else if (e.key.toLowerCase() === 'r') {
            handleReset();
          } else if (e.key.toLowerCase() === 'm') {
            handleOrientationCycle();
          } else if (e.key.toLowerCase() === 'g') {
            setShowGuide(prev => !prev);
          } else if (e.key.toLowerCase() === 'f') {
            toggleFullscreen();
          } else if (e.key === 'Escape') {
            setIsScriptManagerOpen(false);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handlePlayPause, handleReset, orientation]);

      return (
        <main className="w-screen h-screen relative overflow-hidden bg-black flex flex-col">
          <TeleprompterDisplay
            ref={scrollContainerRef}
            text={activeScript.text}
            orientation={orientation}
            width={width}
            fontSize={fontSize}
            lineHeight={lineHeight}
            fontFamily={fontFamily}
            colors={colors}
            guidePosition={guidePosition}
            showGuide={showGuide}
            onWidthChange={setWidth}
            onGuidePositionChange={setGuidePosition}
            onHandDragChange={setIsHandDragging}
          />

          <FloatingControls
            isPlaying={isPlaying}
            speed={speed}
            fontSize={fontSize}
            width={width}
            orientation={orientation}
            showGuide={showGuide}
            controlsVisible={controlsVisible}
            isCountingDown={isCountingDown}
            countdownValue={countdownValue}
            onPlayPause={handlePlayPause}
            onReset={handleReset}
            onSpeedChange={setSpeed}
            onFontSizeChange={setFontSize}
            onWidthChange={setWidth}
            onOrientationCycle={handleOrientationCycle}
            onToggleGuide={() => setShowGuide(prev => !prev)}
            onToggleControls={() => setControlsVisible(prev => !prev)}
            onOpenScriptManager={() => setIsScriptManagerOpen(true)}
            onToggleFullscreen={toggleFullscreen}
          />

          {/* Animated Countdown Overlay with Instant Launch Hint */}
          {isCountingDown && (
            <div className="fixed inset-0 z-40 flex flex-col items-center justify-center pointer-events-none bg-black/40 backdrop-blur-[2px]">
              <div className="w-28 h-28 rounded-3xl bg-blue-600/90 border border-blue-400/50 shadow-2xl flex items-center justify-center text-6xl font-black text-white animate-pulse">
                {countdownValue}
              </div>
              <div className="mt-4 px-3.5 py-1.5 rounded-full bg-gray-900/90 border border-gray-700/60 text-xs font-medium text-gray-300 backdrop-blur-md shadow-lg flex items-center gap-2">
                <kbd className="bg-gray-800 border border-gray-600 px-1.5 py-0.5 rounded text-[10px] text-white font-mono">Espace</kbd>
                <span>pour démarrer immédiatement</span>
              </div>
            </div>
          )}

          <ScriptManagerModal
            isOpen={isScriptManagerOpen}
            onClose={() => setIsScriptManagerOpen(false)}
            scripts={scripts}
            activeScriptId={activeScriptId}
            onSelectScript={setActiveScriptId}
            onSaveScript={handleSaveScript}
            onDeleteScript={handleDeleteScript}
            onImportJson={handleImportJson}
            onExportJson={handleExportJson}
            countdownDuration={countdownDuration}
            onCountdownDurationChange={setCountdownDuration}
            fontFamily={fontFamily}
            onFontFamilyChange={setFontFamily}
            lineHeight={lineHeight}
            onLineHeightChange={setLineHeight}
            colors={colors}
            onColorsChange={setColors}
            onResetColors={handleResetColors}
            guidePosition={guidePosition}
            onGuidePositionChange={setGuidePosition}
            showGuide={showGuide}
            onToggleGuide={() => setShowGuide(prev => !prev)}
            orientation={orientation}
            onOrientationCycle={handleOrientationCycle}
          />
        </main>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>
</html>
